name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  action:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Scan the safe example (must pass)
        uses: ./
        with:
          path: examples/safe-setup
          fail-on: low
          sarif: safe.sarif
      - name: Scan the risky example (must find problems)
        id: risky
        uses: ./
        with:
          path: examples/risky-setup
          fail-on: none
          sarif: risky.sarif
      - name: Check the risky example scored badly
        run: |
          echo "score=${{ steps.risky.outputs.score }} grade=${{ steps.risky.outputs.grade }} findings=${{ steps.risky.outputs.findings }}"
          test "${{ steps.risky.outputs.grade }}" = "F"
