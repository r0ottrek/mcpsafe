name: Release

# Runs on every push to main. When package.json has a version that has not
# been released yet, it tags it (v1.2.3 plus the moving major tag v1 used by
# the GitHub Action) and creates a GitHub release. If an NPM_TOKEN secret is
# set and this version is not on npm yet, it also publishes the package.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm test

      - name: Read version
        id: v
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major=v${version%%.*}" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and create GitHub release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          MAJOR: ${{ steps.v.outputs.major }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git tag -f "$MAJOR"
          git push origin "v$VERSION"
          git push -f origin "$MAJOR"
          gh release create "v$VERSION" --title "v$VERSION" --generate-notes --latest

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NPM_TOKEN secret is not set, skipping npm publish."
            exit 0
          fi
          if [ "$(npm view "mcpsafe@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "mcpsafe@$VERSION is already on npm."
            exit 0
          fi
          npm publish --provenance --access public
